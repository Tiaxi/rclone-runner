<div class="log-actions">
  <span id="log-load-status" class="field-note" {% if not log_chunk.has_more %}hidden{% endif %}>Scroll up to load older lines.</span>
  <a class="button secondary" href="{{ raw_log_url }}" target="_blank" rel="noopener">Open raw log</a>
</div>
<div class="log-viewer">
  <pre
    id="log-output"
    class="log"
    data-chunk-url="{{ log_chunk_url }}"
    data-append-url="{{ log_append_url }}"
    data-status-url="{{ log_status_url }}"
    data-append-offset="{{ log_append_offset }}"
    data-chunk-start="{{ log_chunk.start }}"
    data-live="{{ 'true' if run.status == 'running' and log_status_url else 'false' }}"
    data-next-before="{{ log_chunk.next_before if log_chunk.next_before is not none else '' }}"
    data-has-more="{{ 'true' if log_chunk.has_more else 'false' }}"
  >{{ log_chunk.text }}</pre>
</div>

<script src="/static/ansi.js"></script>
<script>
  (() => {
    const output = document.querySelector("#log-output");
    const loadStatus = document.querySelector("#log-load-status");
    const statusText = document.querySelector("#run-status");
    const exitCode = document.querySelector("#run-exit-code");
    const finishedAt = document.querySelector("#run-finished-at");
    const elapsed = document.querySelector("#run-elapsed");
    const progress = document.querySelector("#run-progress");
    const progressItem = document.querySelector("#run-progress-item");
    const cancelForm = document.querySelector("#cancel-run-form");
    let loading = false;
    let live = output.dataset.live === "true";
    let appendOffset = Number.parseInt(output.dataset.appendOffset || "0", 10);
    // The log on screen as pieces of text, each with the byte offset where it starts in the
    // file. The server cuts pieces at whole characters, so trimming whole pieces keeps exact
    // offsets without re-encoding text in the browser.
    let segments = [
      { text: output.textContent, start: Number.parseInt(output.dataset.chunkStart || "0", 10) },
    ];
    // While following a live run, keep only the newest output on screen; re-rendering the
    // whole log every second makes the tab crawl during long runs. Trimmed lines can be
    // loaded again by scrolling up, and the raw log has everything.
    const MAX_LIVE_LOG_CHARS = 200000;
    // Fetch at most this many append pages per poll when catching up with a fast log.
    const MAX_APPENDS_PER_POLL = 20;

    function logText() {
      return segments.map((segment) => segment.text).join("");
    }

    function renderLog() {
      output.innerHTML = rcloneRunnerAnsi.render(logText());
    }

    function hasMore() {
      return output.dataset.hasMore === "true" && output.dataset.nextBefore !== "";
    }

    function updateStatus() {
      loadStatus.hidden = !hasMore();
      loadStatus.textContent = loading ? "Loading older lines..." : "Scroll up to load older lines.";
    }

    async function loadOlderLines() {
      if (loading || !hasMore()) {
        return;
      }
      loading = true;
      updateStatus();
      const previousHeight = output.scrollHeight;
      const response = await fetch(`${output.dataset.chunkUrl}?before=${output.dataset.nextBefore}`);
      const chunk = await response.json();
      segments.unshift({ text: chunk.text, start: chunk.next_before ?? 0 });
      renderLog();
      output.dataset.nextBefore = chunk.next_before ?? "";
      output.dataset.hasMore = chunk.has_more ? "true" : "false";
      output.scrollTop = output.scrollHeight - previousHeight;
      loading = false;
      updateStatus();
    }

    function isPinnedToBottom() {
      return output.scrollHeight - output.scrollTop - output.clientHeight <= 24;
    }

    async function refreshStatus() {
      if (!output.dataset.statusUrl) {
        return;
      }
      const response = await fetch(output.dataset.statusUrl);
      const state = await response.json();
      if (statusText && state.status) {
        statusText.textContent = state.status.charAt(0).toUpperCase() + state.status.slice(1);
        statusText.className = `run-status ${state.status}`;
      }
      if (exitCode) {
        exitCode.textContent = state.exit_label ?? "Pending";
      }
      if (finishedAt) {
        finishedAt.textContent = state.finished_at ?? "Running";
      }
      if (elapsed && state.elapsed) {
        elapsed.textContent = state.elapsed;
      }
      if (progress) {
        progress.textContent = state.progress ?? progress.dataset.waiting;
        progressItem.hidden = state.status !== "running";
      }
      if (!state.can_cancel && cancelForm) {
        cancelForm.remove();
      }
      live = state.status === "running";
    }

    async function appendNewOutput() {
      if (!output.dataset.appendUrl) {
        return;
      }
      const pinned = isPinnedToBottom();
      let changed = false;
      for (let page = 0; page < MAX_APPENDS_PER_POLL; page++) {
        const response = await fetch(`${output.dataset.appendUrl}?offset=${appendOffset}`);
        const chunk = await response.json();
        if (chunk.text) {
          segments.push({ text: chunk.text, start: chunk.start ?? appendOffset });
          changed = true;
        }
        appendOffset = chunk.offset ?? appendOffset;
        if (pinned) {
          trimLiveLog();
        }
        if (!chunk.more) {
          break;
        }
      }
      output.dataset.appendOffset = appendOffset;
      if (changed) {
        renderLog();
        if (pinned) {
          output.scrollTop = output.scrollHeight;
        }
      }
    }

    function trimLiveLog() {
      let total = segments.reduce((sum, segment) => sum + segment.text.length, 0);
      if (total <= MAX_LIVE_LOG_CHARS) {
        return;
      }
      while (total > MAX_LIVE_LOG_CHARS && segments.length > 1) {
        total -= segments.shift().text.length;
      }
      // Scrolling up loads the lines that end where the first kept piece starts.
      const start = segments[0].start;
      output.dataset.nextBefore = start > 0 ? String(start) : "";
      output.dataset.hasMore = start > 0 ? "true" : "false";
      updateStatus();
    }

    async function pollLiveRun() {
      if (!live) {
        return;
      }
      await appendNewOutput();
      await refreshStatus();
      if (live) {
        window.setTimeout(pollLiveRun, 1000);
      }
    }

    output.addEventListener("scroll", () => {
      if (output.scrollTop <= 8) {
        loadOlderLines();
      }
    });

    updateStatus();
    renderLog();
    requestAnimationFrame(() => {
      output.scrollTop = output.scrollHeight;
    });
    pollLiveRun();
  })();
</script>
