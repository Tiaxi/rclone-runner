services:
  rclone-runner:
    build: .
    container_name: rclone-runner
    restart: unless-stopped
    ports:
      - "${RCLONE_RUNNER_HOST_PORT:-8000}:8000"
    environment:
      TZ: ${TZ:-UTC}
      RCLONE_RUNNER_ADMIN_USER: ${RCLONE_RUNNER_ADMIN_USER:-admin}
      RCLONE_RUNNER_ADMIN_PASSWORD_HASH: ${RCLONE_RUNNER_ADMIN_PASSWORD_HASH:-}
      RCLONE_RUNNER_SECRET_KEY: ${RCLONE_RUNNER_SECRET_KEY:-change-this-long-random-string}
      RCLONE_RUNNER_DATA_DIR: ${RCLONE_RUNNER_DATA_DIR:-/data}
      RCLONE_RUNNER_LOG_DIR: ${RCLONE_RUNNER_LOG_DIR:-/data/logs}
      RCLONE_RUNNER_DATABASE_URL: ${RCLONE_RUNNER_DATABASE_URL:-sqlite:////data/rclone-runner.db}
      RCLONE_RUNNER_TIMEZONE: ${RCLONE_RUNNER_TIMEZONE:-UTC}
      RCLONE_RUNNER_RETENTION_DAYS: ${RCLONE_RUNNER_RETENTION_DAYS:-30}
      RCLONE_CONFIG: ${RCLONE_CONFIG:-/config/rclone/rclone.conf}
    volumes:
      - ${RCLONE_RUNNER_DATA_PATH:-./data}:/data
      - ${RCLONE_RUNNER_RCLONE_CONFIG_PATH:-./rclone-config}:/config/rclone
      # Replace these with TrueNAS dataset mounts in the custom app YAML.
      - ${RCLONE_RUNNER_MEDIA_PATH:-/mnt/tank/media}:/media:ro
